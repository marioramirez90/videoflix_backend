<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videoflix Account Activation</title>
  <style>
    body { margin: 0; padding: 0; background-color: #141414; font-family: Arial, sans-serif; color: #ffffff; }
    .container { max-width: 600px; margin: 30px auto; background-color: #1f1f1f; border-radius: 8px; overflow: hidden; }
    .header { background-color: #0b0b0b; padding: 24px; text-align: center; }
    .logo { color: #E50914; font-size: 28px; font-weight: bold; letter-spacing: 2px; }
    .content { padding: 32px 24px; line-height: 1.6; }
    .btn-container { text-align: center; margin: 32px 0; }
    .btn { background-color: #E50914; color: #ffffff !important; padding: 14px 28px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; }
    .footer { padding: 20px 24px; font-size: 12px; color: #8c8c8c; border-top: 1px solid #2d2d2d; text-align: center; }
    .link { color: #E50914; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">VIDEOFLIX</div>
    </div>
    <div class="content">
      <h2>Welcome to Videoflix!</h2>
      <p>Hello {{ email }},</p>
      <p>Thank you for registering. Please click the button below to activate your account:</p>
      <div class="btn-container">
        <a href="{{ activation_url }}" class="btn">Activate Account</a>
      </div>
      <p>Alternatively, you can copy and paste this link into your browser:</p>
      <p><a href="{{ activation_url }}" class="link">{{ activation_url }}</a></p>
    </div>
    <div class="footer">
      <p>&copy; Videoflix. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
